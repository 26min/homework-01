[project]
name = "pythonproject4"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "requests (>=2.32.5,<3.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = [
    'venv/'
    ]


[tool.isort]
# максимальная длина строки
line_length = 119
multi_line_output = 3


[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы и папки, которые не нужно форматировать
exclude = '''
(
  /(\.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)

'''
